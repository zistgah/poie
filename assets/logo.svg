<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Proclamation of Individual Equity">
  <defs><radialGradient id="g" cx="50%" cy="42%" r="55%">
    <stop offset="0%" stop-color="#c8901f"/><stop offset="100%" stop-color="#8a5c10"/>
  </radialGradient></defs>
  <circle cx="60" cy="60" r="58" fill="#fbf6e9" stroke="#9a6a12" stroke-width="2"/>
  <!-- canopy -->
  <circle cx="60" cy="46" r="26" fill="url(#g)"/>
  <circle cx="42" cy="52" r="12" fill="url(#g)"/>
  <circle cx="78" cy="52" r="12" fill="url(#g)"/>
  <!-- trunk -->
