name: deploy-pages
on:
  push: { branches: ["main"], paths: ["docs/**", "proclamation/**", "assets/**"] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: "pages", cancel-in-progress: false }
jobs:
  deploy:
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          mkdir -p _site/proclamation _site/assets
          cp proclamation/proclamation-v1.png _site/proclamation/
          cp proclamation/proclamation-v1.pdf _site/proclamation/
          cp assets/parchment.png _site/assets/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: "_site" }
      - id: deployment
        uses: actions/deploy-pages@v4
